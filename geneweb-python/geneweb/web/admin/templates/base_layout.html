<!DOCTYPE html>
<html lang="{{ lang | default('en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}GeneWeb Admin{% endblock %}</title>
    <link rel="stylesheet"
          href="/static/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">
    <style>
        .gw-brand {
            font-weight: bold;
            font-size: 1.25rem;
        }
        .gw-brand span {
            color: #90c24e;
        }
        .card-header-gw {
            background-color: #90c24e;
            color: #fff;
        }
        .footer-gw {
            border-top: 2px solid #dee2e6;
            padding: 1rem 0;
            margin-top: 2rem;
            text-align: center;
            font-size: 0.875rem;
            color: #6c757d;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <a class="sr-only sr-only-focusable" href="#main-content">Skip to main content</a>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <a class="navbar-brand gw-brand" href="/">
            <i class="fas fa-tree mr-1" style="color:#90c24e;" aria-hidden="true"></i>
            gene<span>web</span> Admin
        </a>
        <button class="navbar-toggler" type="button"
                data-toggle="collapse"
                data-target="#adminNav"
                aria-controls="adminNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">
                        <i class="fas fa-home mr-1" aria-hidden="true"></i>Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/list">
                        <i class="fas fa-database mr-1" aria-hidden="true"></i>Databases
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/welcome">
                        <i class="fas fa-th-large mr-1" aria-hidden="true"></i>Welcome
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main content -->
    <main id="main-content" class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container footer-gw">
        <i class="fas fa-tree mr-1" style="color:#90c24e;" aria-hidden="true"></i>
        GeneWeb &mdash; Version 7.1-beta
        &copy; 1998-2021
    </footer>

    <!-- Scripts -->
    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}

</body>
</html>
