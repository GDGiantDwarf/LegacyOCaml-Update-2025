{% extends "base_layout.html" %}

{% block title %}GeneWeb Admin - Delete{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1 class="h3">
            <i class="fas fa-trash-alt mr-2"></i>
            Delete a Database
        </h1>
        <hr>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <i class="fas fa-exclamation-triangle mr-1"></i>
                Delete Database
            </div>
            <div class="card-body">
                {% if bases %}
                <form id="delete-form">
                    <div class="form-group">
                        <label for="delete-select"
                               class="font-weight-bold">
                            Select the database to delete:
                        </label>
                        <select class="form-control"
                                id="delete-select"
                                name="base"
                                required>
                            {% for b in bases %}
                            <option value="{{ b }}">{{ b }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group form-check">
                        <input type="checkbox"
                               class="form-check-input"
                               id="confirm-check">
                        <label class="form-check-label"
                               for="confirm-check">
                            I understand this action is irreversible
                        </label>
                    </div>
                    <button type="submit"
                            class="btn btn-danger"
                            id="delete-btn"
                            disabled>
                        <i class="fas fa-trash-alt mr-1"></i>
                        Delete
                    </button>
                </form>
                {% else %}
                <div class="alert alert-info mb-0">
                    <i class="fas fa-info-circle mr-1"></i>
                    No databases found.
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<!-- Alert container -->
<div id="alert-container"
     style="position:fixed;top:70px;right:20px;z-index:9999;
            width:350px;">
</div>
{% endblock %}

{% block scripts %}
<script>
function showAlert(message, type) {
    var cls = (type === "error") ? "danger" : "success";
    var html = '<div class="alert alert-' + cls +
        ' alert-dismissible fade show" role="alert">' +
        message +
        '<button type="button" class="close" ' +
        'data-dismiss="alert" aria-label="Close">' +
        '<span aria-hidden="true">&times;</span>' +
        '</button></div>';
    var container = document.getElementById("alert-container");
    container.innerHTML = html;
    setTimeout(function() {
        container.innerHTML = "";
    }, 4000);
}

/* Enable / disable delete button based on checkbox */
var checkbox = document.getElementById("confirm-check");
var deleteBtn = document.getElementById("delete-btn");
if (checkbox && deleteBtn) {
    checkbox.addEventListener("change", function() {
        deleteBtn.disabled = !this.checked;
    });
}

var form = document.getElementById("delete-form");
if (form) {
    form.addEventListener("submit", async function(e) {
        e.preventDefault();
        var name = document.getElementById("delete-select").value;
        if (!confirm(
            'Are you sure you want to delete "' + name + '"?'
        )) {
            return;
        }
        deleteBtn.disabled = true;
        deleteBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin mr-1"></i>' +
            'Deleting...';
        try {
            var res = await fetch(
                "/api/bases/" + name,
                {method: "DELETE"}
            );
            if (res.status === 204) {
                showAlert(
                    'Database "' + name + '" deleted.',
                    "success"
                );
                setTimeout(function() {
                    location.reload();
                }, 1000);
            } else {
                var err = await res.json().catch(
                    function() { return {}; }
                );
                showAlert(
                    "Error: " + (err.detail || res.status),
                    "error"
                );
            }
        } catch (ex) {
            showAlert("Network error.", "error");
        }
        deleteBtn.disabled = false;
        deleteBtn.innerHTML =
            '<i class="fas fa-trash-alt mr-1"></i>Delete';
        checkbox.checked = false;
        deleteBtn.disabled = true;
    });
}
</script>
{% endblock %}
