{% extends "base_layout.html" %}

{% block title %}GeneWeb Admin - Import{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1 class="h3">
            <i class="fas fa-file-import mr-2"></i>
            Import a Database
        </h1>
        <hr>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header card-header-gw">
                <i class="fas fa-upload mr-1"></i>
                Upload a File
            </div>
            <div class="card-body">
                <form id="import-form"
                      enctype="multipart/form-data">
                    <div class="form-group">
                        <label class="font-weight-bold">
                            Name for the new database:
                        </label>
                        <input type="text"
                               class="form-control"
                               id="base-name"
                               name="name"
                               placeholder="my_family_tree"
                               required
                               pattern="[A-Za-z0-9_-]{1,64}">
                        <small class="form-text text-muted">
                            Letters, digits, hyphens
                            and underscores only.
                        </small>
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold">
                            File format:
                        </label>
                        <div class="form-check">
                            <input class="form-check-input"
                                   type="radio"
                                   name="format"
                                   id="fmt-gedcom"
                                   value="gedcom"
                                   checked>
                            <label class="form-check-label"
                                   for="fmt-gedcom">
                                GEDCOM (.ged)
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input"
                                   type="radio"
                                   name="format"
                                   id="fmt-sqlite"
                                   value="sqlite">
                            <label class="form-check-label"
                                   for="fmt-sqlite">
                                SQLite (.db)
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input"
                                   type="radio"
                                   name="format"
                                   id="fmt-zip"
                                   value="zip">
                            <label class="form-check-label"
                                   for="fmt-zip">
                                ZIP archive (.zip)
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold">
                            Select file:
                        </label>
                        <input type="file"
                               class="form-control-file"
                               id="import-file"
                               name="file"
                               required
                               accept=".ged,.db,.zip">
                    </div>
                    <button type="submit"
                            class="btn btn-success"
                            id="import-btn">
                        <i class="fas fa-upload mr-1"></i>
                        Import
                    </button>
                    <a href="/welcome"
                       class="btn btn-secondary ml-2">
                        <i class="fas fa-arrow-left mr-1"></i>
                        Back
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>

<div id="alert-container"
     style="position:fixed;top:70px;right:20px;
            z-index:9999;width:350px;">
</div>
{% endblock %}

{% block scripts %}
<script>
function showAlert(message, type) {
    var cls = (type === "error") ? "danger" : "success";
    var html = '<div class="alert alert-' + cls +
        ' alert-dismissible fade show" role="alert">' +
        message +
        '<button type="button" class="close" ' +
        'data-dismiss="alert" aria-label="Close">' +
        '<span aria-hidden="true">&times;</span>' +
        '</button></div>';
    var c = document.getElementById("alert-container");
    c.innerHTML = html;
    setTimeout(function() { c.innerHTML = ""; }, 5000);
}

var form = document.getElementById("import-form");
if (form) {
    form.addEventListener("submit", async function(e) {
        e.preventDefault();
        var btn = document.getElementById("import-btn");
        var fileInput = document.getElementById(
            "import-file"
        );
        var nameInput = document.getElementById(
            "base-name"
        );
        var fmt = form.querySelector(
            'input[name="format"]:checked'
        );
        if (!fileInput.files.length) {
            showAlert("Please select a file.", "error");
            return;
        }
        btn.disabled = true;
        btn.innerHTML =
            '<i class="fas fa-spinner fa-spin mr-1">' +
            '</i>Importing...';
        var fd = new FormData();
        fd.append("file", fileInput.files[0]);
        fd.append("name", nameInput.value);
        fd.append("format", fmt.value);
        try {
            var res = await fetch(
                "/api/bases/import", {
                    method: "POST",
                    body: fd,
                }
            );
            var data = await res.json().catch(
                function() { return {}; }
            );
            if (res.ok) {
                showAlert(
                    'Database "' + nameInput.value +
                    '" imported successfully!',
                    "success"
                );
                form.reset();
            } else {
                showAlert(
                    "Error: " +
                    (data.detail || res.status),
                    "error"
                );
            }
        } catch (ex) {
            showAlert("Network error.", "error");
        }
        btn.disabled = false;
        btn.innerHTML =
            '<i class="fas fa-upload mr-1"></i>Import';
    });
}
</script>
{% endblock %}
