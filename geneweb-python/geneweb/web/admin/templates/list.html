{% extends "base_layout.html" %}

{% block title %}GeneWeb Admin - Databases{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1 class="h3">
            <i class="fas fa-database mr-2"></i>
            Databases
        </h1>
        <hr>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header card-header-gw
                        d-flex justify-content-between
                        align-items-center">
                <span>
                    <i class="fas fa-list mr-1"></i>
                    All Databases
                </span>
                <button class="btn btn-sm btn-light"
                        onclick="loadBases()">
                    <i class="fas fa-sync-alt mr-1">
                    </i>Refresh
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover
                                  mb-0"
                           id="bases-table">
                        <thead class="thead-light">
                            <tr>
                                <th>Name</th>
                                <th class="text-center">
                                    Actions
                                </th>
                            </tr>
                        </thead>
                        <tbody id="bases-tbody">
                        </tbody>
                    </table>
                </div>
                <div id="loading-indicator"
                     class="text-center py-4">
                    <i class="fas fa-spinner fa-spin
                              fa-2x text-muted"></i>
                    <p class="text-muted mt-2">
                        Loading databases...
                    </p>
                </div>
                <div id="empty-indicator"
                     class="text-center py-4 d-none">
                    <i class="fas fa-inbox fa-2x
                              text-muted"></i>
                    <p class="text-muted mt-2">
                        No databases found.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<p class="mt-3">
    Or go back to the
    <a href="/welcome">main menu (welcome)</a>.
</p>

<div id="alert-container"
     style="position:fixed;top:70px;right:20px;
            z-index:9999;width:350px;">
</div>
{% endblock %}

{% block scripts %}
<script>
function showAlert(message, type) {
    var cls = (type === "error") ? "danger" : "success";
    var html = '<div class="alert alert-' + cls +
        ' alert-dismissible fade show" role="alert">' +
        message +
        '<button type="button" class="close" ' +
        'data-dismiss="alert" aria-label="Close">' +
        '<span aria-hidden="true">&times;</span>' +
        '</button></div>';
    var c = document.getElementById("alert-container");
    c.innerHTML = html;
    setTimeout(function() { c.innerHTML = ""; }, 4000);
}

function escHtml(s) {
    var d = document.createElement("div");
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
}

async function loadBases() {
    var tbody = document.getElementById("bases-tbody");
    var loading = document.getElementById(
        "loading-indicator"
    );
    var empty = document.getElementById(
        "empty-indicator"
    );
    tbody.innerHTML = "";
    loading.classList.remove("d-none");
    empty.classList.add("d-none");

    try {
        var res = await fetch("/api/bases");
        if (res.status !== 200) {
            showAlert(
                "Failed to load databases.", "error"
            );
            loading.classList.add("d-none");
            return;
        }
        var data = await res.json();
        var bases = data.bases || [];
        loading.classList.add("d-none");

        if (bases.length === 0) {
            empty.classList.remove("d-none");
            return;
        }

        for (var i = 0; i < bases.length; i++) {
            var name = bases[i];
            var safe = escHtml(name);
            var row = document.createElement("tr");
            row.innerHTML =
                '<td class="align-middle">' +
                '<i class="fas fa-database mr-1 ' +
                'text-muted"></i>' +
                '<strong>' + safe + '</strong>' +
                '</td>' +
                '<td class="text-center">' +
                '<div class="btn-group btn-group-sm">' +
                '<button class="btn ' +
                'btn-outline-secondary" ' +
                'title="Cleanup" ' +
                'onclick="cleanupBase(\'' +
                safe + '\')">' +
                '<i class="fas fa-broom"></i>' +
                '</button>' +
                '<button class="btn ' +
                'btn-outline-primary" ' +
                'title="Rename" ' +
                'onclick="renameBase(\'' +
                safe + '\')">' +
                '<i class="fas fa-pen"></i>' +
                '</button>' +
                '<button class="btn ' +
                'btn-outline-danger" ' +
                'title="Delete" ' +
                'onclick="deleteBase(\'' +
                safe + '\')">' +
                '<i class="fas fa-trash-alt"></i>' +
                '</button>' +
                '<button class="btn ' +
                'btn-outline-info" ' +
                'title="Export" ' +
                'onclick="exportBase(\'' +
                safe + '\')">' +
                '<i class="fas fa-file-export">' +
                '</i></button>' +
                '<button class="btn ' +
                'btn-outline-success" ' +
                'title="Backup" ' +
                'onclick="backupBase(\'' +
                safe + '\')">' +
                '<i class="fas fa-download">' +
                '</i></button>' +
                '</div></td>';
            tbody.appendChild(row);
        }
    } catch (ex) {
        loading.classList.add("d-none");
        showAlert(
            "Network error loading databases.",
            "error"
        );
    }
}

async function cleanupBase(name) {
    if (!confirm(
        'Cleanup database "' + name + '"?'
    )) return;
    try {
        var res = await fetch(
            "/api/bases/" + name + "/cleanup",
            {method: "POST"}
        );
        if (res.status === 200) {
            showAlert(
                '"' + name + '" cleaned up.',
                "success"
            );
        } else {
            var e = await res.json().catch(
                function() { return {}; }
            );
            showAlert(
                "Error: " + (e.detail || res.status),
                "error"
            );
        }
    } catch (ex) {
        showAlert("Network error.", "error");
    }
}

async function renameBase(name) {
    var newName = prompt(
        'New name for "' + name + '":', name
    );
    if (!newName || newName === name) return;
    try {
        var res = await fetch(
            "/api/bases/" + name + "/rename",
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(
                    {new_name: newName}
                ),
            }
        );
        if (res.status === 200) {
            showAlert(
                'Renamed to "' + newName + '".',
                "success"
            );
            setTimeout(loadBases, 500);
        } else {
            var e = await res.json().catch(
                function() { return {}; }
            );
            showAlert(
                "Error: " + (e.detail || res.status),
                "error"
            );
        }
    } catch (ex) {
        showAlert("Network error.", "error");
    }
}

async function deleteBase(name) {
    if (!confirm(
        'Delete database "' + name + '"?'
    )) return;
    try {
        var res = await fetch(
            "/api/bases/" + name,
            {method: "DELETE"}
        );
        if (res.status === 204) {
            showAlert(
                '"' + name + '" deleted.', "success"
            );
            setTimeout(loadBases, 500);
        } else {
            showAlert(
                "Error deleting database.", "error"
            );
        }
    } catch (ex) {
        showAlert("Network error.", "error");
    }
}

async function exportBase(name) {
    var fmt = prompt(
        'Export format for "' + name +
        '"?\n(gedcom, sqlite, zip)',
        "gedcom"
    );
    if (!fmt) return;
    try {
        var res = await fetch(
            "/api/bases/" + name +
            "/export?format=" + fmt,
            {method: "POST"}
        );
        if (res.ok) {
            var blob = await res.blob();
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            var ext = {
                gedcom: ".ged",
                sqlite: ".db",
                zip: ".zip",
            };
            a.download = name + (ext[fmt] || ".db");
            a.click();
            showAlert("Export downloaded!", "success");
        } else {
            var e = await res.json().catch(
                function() { return {}; }
            );
            showAlert(
                "Error: " + (e.detail || res.status),
                "error"
            );
        }
    } catch (ex) {
        showAlert("Network error.", "error");
    }
}

async function backupBase(name) {
    try {
        var res = await fetch(
            "/api/bases/" + name + "/backup",
            {method: "POST"}
        );
        if (res.ok) {
            var blob = await res.blob();
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = name + ".zip";
            a.click();
            showAlert("Backup downloaded!", "success");
        } else {
            var e = await res.json().catch(
                function() { return {}; }
            );
            showAlert(
                "Error: " + (e.detail || res.status),
                "error"
            );
        }
    } catch (ex) {
        showAlert("Network error.", "error");
    }
}

document.addEventListener("DOMContentLoaded", loadBases);
</script>
{% endblock %}
